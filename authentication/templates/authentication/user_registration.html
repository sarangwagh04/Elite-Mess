{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h2>User Registration</h2>
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username:</label>
            {{ user_form.username }}
            <label for="id_email">Email:</label>
            {{ user_form.email }}
            <label for="id_password">Password:</label>
            {{ user_form.password }}
            <label for="id_first_name">First Name:</label>
            {{ user_form.first_name }}
            <label for="id_last_name">Last Name:</label>
            {{ user_form.last_name }}
            <label>Membership:</label>
            <input type="checkbox" id="id_is_hostel_member" name="is_hostel_member">
            <label for="id_is_hostel_member">Hostel Member</label>
            <input type="checkbox" id="id_is_mess_member" name="is_mess_member">
            <label for="id_is_mess_member">Mess Member</label>
            <button type="submit">Register</button>
        </form>
        {% if form.errors %}
        <div class="error-message">
            <strong>Error:</strong> Please check the form and try again.
        </div>
        {% endif %}
        <div class="links">
            <a href="{% url 'authentication:login' %}">Login instead</a>
        </div>
    </div>
</body>
</html>
