{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrapper" style="margin: 2rem 0;">
    <div class="glass-card auth-card" style="max-width: 500px;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Join MMS</h2>
        <form method="post" action="{% url 'authentication:register' %}">
            {% csrf_token %}
            
            {% for field in user_form %}
                <div class="input-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type|default:'text' }}" 
                           name="{{ field.html_name }}" 
                           id="{{ field.id_for_label }}"
                           {% if field.field.required %}required{% endif %}>
                    {% if field.errors %}
                        <div style="color: var(--error); font-size: 0.75rem; margin-top: 0.25rem;">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="input-group">
                <label>Register as:</label>
                <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="role" value="STUDENT" checked style="width: auto; margin: 0;"> Student
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="radio" name="role" value="MESS_OWNER" style="width: auto; margin: 0;"> Mess Owner (Staff)
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
            <span style="color: var(--text-secondary);">Already have an account?</span>
            <a href="{% url 'authentication:login' %}" style="color: var(--accent-blue); text-decoration: none; font-weight: 600;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
